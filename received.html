<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>رسائل مستلمة — Falcon</title><link rel="stylesheet" href="/style.css"></head><body><header class="falconHeader"><a class="brand" href="/admins.html"><div><b>Falcon Admins</b><small>RECEIVED ORDERS</small></div></a><a class="btn dark pageExitTop" href="/admins.html">× خروج</a></header><main class="inboxPage"><div class="pageTop"><div><div class="modalBadge">ADMIN RECEIVED</div><h1>📥 رسائل مستلمة</h1><p class="muted">كل عمليات الشراء بالتفاصيل التي كتبها العضو.</p></div></div><section class="inboxList" id="list"><p class="muted">جاري التحميل...</p></section></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(u,o={}){const x={...o,credentials:'same-origin',headers:{...(o.headers||{})}};if(x.body&&typeof x.body!=='string'){x.headers['Content-Type']='application/json';x.body=JSON.stringify(x.body)}const r=await fetch(u,x);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}
async function load(){try{const d=await api('/api/owner');const rows=d.purchases||[];$('list').innerHTML=rows.length?rows.map(o=>{const details=o.details||{};const lines=Object.entries(details).map(([k,v])=>`${esc(k)}: ${esc(typeof v==='boolean'?(v?'نعم':'لا'):v)}`).join('\n');return `<article class="inboxCard"><h3>🛒 ${esc(o.product)}</h3><div class="meta">العضو: ${esc(o.user)} • الطلب: ${esc(String(o.id).slice(0,8))} • ${new Date(o.date).toLocaleString('ar-EG')}</div><div class="details">السعر: ${Number(o.amountPaid??o.price).toLocaleString('ar-EG')} 🪙\nالحالة: ${esc(o.status||'سيتم التسليم')}\n${esc(o.note||'')}${lines?'\n\n'+lines:''}</div><div class="inboxActions">${o.status!=='تم التسليم'&&o.status!=='ملغي'?`<button onclick="deliver('${esc(o.id)}')">تم التسليم ✅</button><button class="danger" onclick="cancelOrder('${esc(o.id)}')">إلغاء</button>`:'<button disabled>${esc(o.status)}</button>'}</div></article>`}).join(''):'<p class="muted">لا توجد عمليات شراء.</p>'}catch(e){$('list').innerHTML='<p class="muted">تعذر تحميل الطلبات.</p>'}}
async function deliver(id){if(!confirm('تأكيد تسليم الطلب؟'))return;try{await api('/api/owner/order-status',{method:'POST',body:{id,status:'تم التسليم'}});load()}catch(e){alert(e.message)}}
async function cancelOrder(id){if(!confirm('إلغاء الطلب وإرجاع العملات للعضو؟'))return;try{await api('/api/owner/order-status',{method:'POST',body:{id,status:'ملغي'}});load()}catch(e){alert(e.message)}}load();
</script></body></html>
