<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#050507;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh}*{box-sizing:border-box}.page{width:min(1050px,94%);margin:auto;padding:22px 0 90px}.head{position:sticky;top:0;z-index:10;background:rgba(5,5,7,.96);backdrop-filter:blur(14px);border-bottom:1px solid #321619;padding:14px 3%;display:flex;align-items:center;justify-content:space-between}.head a{color:#fff;text-decoration:none}.close{border:1px solid #542024;background:#100b0c;color:#fff;border-radius:12px;padding:10px 14px;text-decoration:none}.card{background:linear-gradient(145deg,#111114,#070708);border:1px solid #321619;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 18px 50px #0008}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:900;color:#ddd}.field input,.field textarea,.field select{width:100%;padding:14px;border-radius:13px;border:1px solid #392024;background:#0b0b0f;color:#fff;outline:none}.field textarea{min-height:120px;resize:vertical}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#ff3b30,#b90e15);color:#fff}.muted{color:#9b9ba3}.status{display:inline-block;padding:5px 10px;border-radius:999px;background:#180f10;border:1px solid #512125;color:#ffb6b6;font-size:12px;font-weight:900}.status.done{color:#98ff9d;border-color:#195221}.status.review{color:#ffd46d;border-color:#5a4314}.empty{text-align:center;padding:35px;color:#888}.new{display:inline-block;border:1px solid #ff4b52;color:#fff;background:#bd0f18;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.page{width:94%}.head h1{font-size:18px}}</style><title>استلام رسائل الدعم الفني</title></head><body><div class="head"><h1>🎧 استلام رسائل الدعم الفني</h1><a class="close" href="/admin.html">× رجوع</a></div><main class="page"><div id="list">جاري التحميل...</div></main><script>async function api(u,o={}){o.credentials='same-origin';o.headers={'Content-Type':'application/json',...(o.headers||{})};if(o.body&&typeof o.body!=='string')o.body=JSON.stringify(o.body);const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'غير مصرح');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function load(){try{const d=await api('/api/owner');document.getElementById('list').innerHTML=(d.supportMessages||[]).map(m=>`<article class="card"><b>🎧 ${esc(m.user)}</b><p>${esc(m.message)}</p><small class="muted">${new Date(m.date).toLocaleString('ar-EG')}</small></article>`).join('')||'<div class="empty">لا توجد رسائل دعم.</div>'}catch(e){document.getElementById('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}load()</script></body></html>
