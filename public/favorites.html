<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6cff"><title>المفضلات — فالكون موقع سامب</title><link rel="stylesheet" href="/style.css">
<style>
.favPage{width:min(1200px,94%);margin:auto;padding:45px 0 90px}.favHero{padding:20px 0 30px}.favHero h1{font-size:clamp(34px,6vw,58px);margin:5px 0}.favHero p{color:#8b95a5}.favGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.favCard{position:relative;background:linear-gradient(145deg,#111927,#0b1018);border:1px solid #20324a;border-radius:22px;padding:22px;min-height:230px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.favCard h3{margin:12px 0 7px}.favCard p{color:#8995a7;min-height:40px}.favPrice{font-size:20px;color:#ffd34e;font-weight:900;margin:18px 0}.favRemove{position:absolute;left:15px;top:15px;border:1px solid #273b56;background:#111923;color:#fff;border-radius:12px;padding:9px 12px;cursor:pointer}.favEmpty{padding:40px;border:1px dashed #27405e;border-radius:20px;color:#8d99aa;text-align:center}@media(max-width:800px){.favGrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.favGrid{grid-template-columns:1fr}}
</style></head><body>
<header><a class="brand" href="/"><div><b>فالكون موقع سامب</b><small>FAVORITES</small></div></a><nav><a href="/">الرئيسية</a><a href="/samp.html">شراء سامب</a><a href="/purchases.html">مشترياتي</a><a href="/auctions.html">المزاد</a></nav><a class="quickBtn" href="/">العودة للموقع</a></header>
<main class="favPage"><section class="favHero"><div class="tag">FALCON FAVORITES</div><h1>❤️ المفضلات</h1><p>كل المنتجات التي حفظتها في مكان واحد.</p></section><div id="favStatus" class="favEmpty">جارٍ التحميل...</div><section id="favGrid" class="favGrid"></section></main>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){
 try{
  const me=await fetch('/api/me',{credentials:'same-origin'}); const md=await me.json();
  if(!md.loggedIn){location.href='/';return}
  const [f,p]=await Promise.all([fetch('/api/favorites'),fetch('/api/products')]);
  const fd=await f.json(),pd=await p.json(); const ids=new Set(fd.favorites||[]);
  const rows=(pd.products||[]).filter(x=>ids.has(x.id));
  $('favStatus').textContent=rows.length?`لديك ${rows.length} منتج في المفضلات`:'لا توجد منتجات محفوظة.';
  $('favGrid').innerHTML=rows.map(x=>`<article class="favCard"><button class="favRemove" onclick="removeFav('${esc(x.id)}')">♥ إزالة</button><div style="font-size:42px">${esc(x.icon||'🛍️')}</div><h3>${esc(x.name)}</h3><p>${esc(x.desc||'')}</p><div class="favPrice">${Number(x.price||0).toLocaleString('ar-EG')} 🪙</div><a class="btn primary" href="/samp.html">فتح في المتجر</a></article>`).join('');
 }catch(e){$('favStatus').textContent='تعذر تحميل المفضلات.'}
}
async function removeFav(id){await fetch('/api/favorites/'+encodeURIComponent(id),{method:'POST'});load()}
load();
</script></body></html>
