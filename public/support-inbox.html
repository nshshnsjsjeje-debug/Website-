<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>استلام رسائل الدعم — Falcon</title><link rel="stylesheet" href="/style.css"></head><body><header class="falconHeader"><a class="brand" href="/admins.html"><div><b>Falcon Admins</b><small>SUPPORT INBOX</small></div></a><a class="btn dark pageExitTop" href="/admins.html">× خروج</a></header><main class="inboxPage"><div class="pageTop"><div><div class="modalBadge">SUPPORT INBOX</div><h1>🎧 استلام رسائل الدعم الفني</h1><p class="muted">كل الرسائل التي أرسلها الأعضاء من زر الدعم الفني.</p></div></div><section class="inboxList" id="list"><p class="muted">جاري التحميل...</p></section></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){try{const r=await fetch('/api/owner',{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw new Error(d.error||'غير مصرح');const rows=d.supportMessages||[];$('list').innerHTML=rows.length?rows.map(x=>`<article class="inboxCard"><h3>🎧 ${esc(x.user)}</h3><div class="meta">${new Date(x.date).toLocaleString('ar-EG')}${x.email?' • '+esc(x.email):''}</div><div class="details">${esc(x.message)}</div></article>`).join(''):'<p class="muted">لا توجد رسائل دعم.</p>'}catch(e){$('list').innerHTML='<p class="muted">تعذر تحميل رسائل الدعم.</p>'}}load();
</script></body></html>
