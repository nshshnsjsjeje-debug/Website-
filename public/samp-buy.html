<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><title>شراء المنتج — فالكون</title><link rel="stylesheet" href="/style.css"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050912;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden}.buyPage{min-height:100vh;padding:24px 16px 70px;background:radial-gradient(circle at 50% 0,#082744 0,transparent 42%),#050912}.buyWrap{max-width:760px;margin:auto}.buyTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.buyTop .brand{font-size:20px;font-weight:900;color:#fff;text-decoration:none}.closeBuy{width:48px;height:48px;border-radius:14px;border:1px solid #278bd0;background:#0a1b2a;color:#fff;font-size:30px;cursor:pointer}.buyCard{background:rgba(10,20,38,.94);border:1px solid #1b5e91;border-radius:24px;padding:26px;box-shadow:0 20px 70px rgba(0,100,220,.16)}.buyTag{color:#42b9ff;font-weight:800;letter-spacing:2px;font-size:13px}.buyCard h1{font-size:clamp(28px,7vw,44px);margin:8px 0}.buyPrice{font-size:22px;color:#ffd43b;font-weight:900;margin:12px 0 24px}.field{margin:17px 0}.field label{display:block;font-size:18px;font-weight:800;margin:0 0 8px}.field input,.field textarea,.field select{width:100%;border:1px solid #24577f;background:#081322;color:#fff;border-radius:15px;padding:16px;font-size:16px;outline:none}.field textarea{min-height:130px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#2d9fff;box-shadow:0 0 0 3px rgba(45,159,255,.12)}.choice{display:flex;gap:10px}.choice button{flex:1;border:1px solid #285879;background:#0a1727;color:#fff;border-radius:13px;padding:13px;font-weight:800}.choice button.active{background:#0878d8;border-color:#45b9ff}.buyBtn{width:100%;border:0;border-radius:16px;padding:17px;margin-top:12px;background:#147ff0;color:#fff;font-size:20px;font-weight:900;cursor:pointer}.buyBtn:active{transform:scale(.99)}.help{color:#9ba8b8;line-height:1.7;margin-top:14px}.errorBox{display:none;background:#35131a;border:1px solid #e04757;color:#ffdce0;border-radius:14px;padding:12px;margin-bottom:14px}.errorBox.show{display:block}@media(max-width:600px){.buyPage{padding:12px 10px 40px}.buyCard{padding:20px 15px;border-radius:20px}.buyTop{margin-bottom:12px}.field label{font-size:16px}.field input,.field textarea,.field select{padding:14px}.choice{flex-direction:column}}
</style></head><body><main class="buyPage"><div class="buyWrap"><div class="buyTop"><a class="brand" href="/samp.html">🛒 شراء سامب</a><button class="closeBuy" onclick="location.href='/samp.html'">×</button></div><section class="buyCard"><div class="buyTag">FALCON STORE • PURCHASE</div><h1 id="title">شراء المنتج</h1><div id="price" class="buyPrice"></div><div id="error" class="errorBox"></div><form id="form"></form><button id="submit" class="buyBtn">شراء</button><div class="help">بعد نجاح الشراء سيتم خصم العملات، ثم تعود تلقائياً للصفحة الرئيسية ويصل الطلب لصاحب الموقع/الإدارة.</div></section></div></main><script>
const $=id=>document.getElementById(id);let product=null;
async function api(url,opts={}){const o={...opts,credentials:'same-origin',headers:{...(opts.headers||{})}};if(o.body&&typeof o.body!=='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(url,o);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(d.error||'حدث خطأ'),{status:r.status,code:d.code});return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function field(id,label,placeholder='',type='text'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}"></div>`}
function area(id,label,placeholder){return `<div class="field"><label>${label}</label><textarea id="${id}" placeholder="${placeholder}"></textarea></div>`}
function gangFields(){return `<div class="field"><label>لعصابتك أو بدون؟</label><div class="choice"><button type="button" class="active" data-gang="بدون عصابة">بدون عصابة</button><button type="button" data-gang="مع عصابة">مع عصابة</button></div></div><div id="gangExtra" style="display:none">${field('gangName','اسم العصابة','اكتب اسم العصابة')}${field('gangColor','لون العصابة','مثال: أزرق')}</div>`}
function buildForm(){let id=product.id,html='';if(id==='customCar'){html=field('carType','نوع العربية','مثال: BMW M5')+field('discord','اسمك في ديسكورد','اكتب اسمك في ديسكورد')+field('carColor','لون العربية','مثال: أسود')+gangFields()}else if(id==='villa'){html=field('discord','اسمك في ديسكورد','اكتب اسمك في ديسكورد')+gangFields()}else if(id==='gangAlley'){html=field('gangName','اسم عصابتك','اكتب اسم العصابة')+field('discord','اسمك في ديسكورد','اكتب اسمك في ديسكورد')+field('gangColor','لون عصابتك','مثال: أزرق')}else if(id==='restaurant'){html=field('discord','اسمك في ديسكورد','اكتب اسمك في ديسكورد')}else if(id==='customSkin'){html=field('discord','اسمك في ديسكورد','اكتب اسمك في ديسكورد')+area('skinDetails','قول كل حاجة عن السكن اللي عايزه','اكتب الشكل، الملابس، الألوان، التفاصيل...')}else{html=field('discord','اسمك في ديسكورد','اكتب اسمك في ديسكورد')+area('orderDetails','تفاصيل الطلب','اكتب كل التفاصيل المطلوبة للمنتج');} $('form').innerHTML=html;document.querySelectorAll('[data-gang]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-gang]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('gangExtra').style.display=b.dataset.gang==='مع عصابة'?'block':'none'});}
function details(){const d={};document.querySelectorAll('#form input,#form textarea').forEach(x=>d[x.id]=x.value.trim());const gang=document.querySelector('[data-gang].active');if(gang){d.gangChoice=gang.dataset.gang;if(d.gangChoice==='بدون عصابة'){delete d.gangName;delete d.gangColor}}return d}
function showError(t){$('error').textContent=t;$('error').classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}
async function init(){try{const id=new URLSearchParams(location.search).get('id');const d=await api('/api/products');product=(d.products||[]).find(x=>x.id===id);if(!product){location.href='/samp.html';return} $('title').textContent='شراء '+product.name;$('price').textContent=Number(product.price).toLocaleString('ar-EG')+' 🪙 عملة فالكون';buildForm();}catch(e){showError(e.message)}}
$('submit').onclick=async()=>{if(!product)return; $('error').classList.remove('show');const det=details();try{const r=await api('/api/order',{method:'POST',body:{product:product.id,details:det,note:Object.values(det).join(' | ')}});location.href='/?purchase=success&product='+encodeURIComponent(product.name)}catch(e){if(e.code==='NO_COINS')showError('ليس لديك عملات كافية لشراء هذا المنتج. لم يتم خصم أي عملات، ولم يتم إخراجك من الصفحة.');else showError(e.message)}};
init();
</script></body></html>
