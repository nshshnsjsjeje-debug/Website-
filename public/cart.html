<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشترياتي - فالكون</title><link rel="stylesheet" href="/style.css"></head><body class="standalonePage"><header><a class="brand" href="/"><div><b>فالكون</b><small>MY PURCHASES</small></div></a><a class="quickBtn" href="/">✕ الرئيسية</a></header><main class="standaloneMain"><div class="pageHero"><span class="tag">FALCON PURCHASES</span><h1>🛒 مشترياتي</h1><p>كل المنتجات التي اشتريتها وحالة تسليم كل طلب.</p></div><section id="purchaseList" class="purchaseList"><p class="muted">جاري التحميل...</p></section></main><script>async function load(){const r=await fetch('/api/purchases',{credentials:'same-origin'});const d=await r.json();if(!r.ok){location.href='/?login=1';return}const box=document.getElementById('purchaseList');box.innerHTML=d.orders.length?d.orders.map(o=>`<article class="purchaseCard"><div class="purchaseIcon">📦</div><div class="purchaseInfo"><h3>${esc(o.product)}</h3><p>رقم الطلب: <b>${esc(o.id.slice(0,8))}</b></p><p>${esc(o.note||'')}</p><strong>${Number(o.price||0).toLocaleString('ar-EG')} 🪙</strong></div><div class="purchaseStatus ${o.status==='تم التسليم'?'done':o.status==='ملغي'?'cancelled':'pending'}">${o.status==='تم التسليم'?'✅ تم التسليم':o.status==='ملغي'?'❌ تم الإلغاء':'📦 سيتم التسليم'}</div></article>`).join(''):'<div class="emptyAuction">لا توجد مشتريات حتى الآن.</div>'}function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}load();setInterval(load,5000);</script></body></html>
