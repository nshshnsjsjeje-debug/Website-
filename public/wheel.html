<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#050507;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh}*{box-sizing:border-box}.page{width:min(1050px,94%);margin:auto;padding:22px 0 90px}.head{position:sticky;top:0;z-index:10;background:rgba(5,5,7,.96);backdrop-filter:blur(14px);border-bottom:1px solid #321619;padding:14px 3%;display:flex;align-items:center;justify-content:space-between}.head a{color:#fff;text-decoration:none}.close{border:1px solid #542024;background:#100b0c;color:#fff;border-radius:12px;padding:10px 14px;text-decoration:none}.card{background:linear-gradient(145deg,#111114,#070708);border:1px solid #321619;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 18px 50px #0008}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:900;color:#ddd}.field input,.field textarea,.field select{width:100%;padding:14px;border-radius:13px;border:1px solid #392024;background:#0b0b0f;color:#fff;outline:none}.field textarea{min-height:120px;resize:vertical}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#ff3b30,#b90e15);color:#fff}.muted{color:#9b9ba3}.status{display:inline-block;padding:5px 10px;border-radius:999px;background:#180f10;border:1px solid #512125;color:#ffb6b6;font-size:12px;font-weight:900}.status.done{color:#98ff9d;border-color:#195221}.status.review{color:#ffd46d;border-color:#5a4314}.empty{text-align:center;padding:35px;color:#888}.new{display:inline-block;border:1px solid #ff4b52;color:#fff;background:#bd0f18;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.page{width:94%}.head h1{font-size:18px}}</style><style>.wheel{width:min(330px,78vw);height:min(330px,78vw);border-radius:50%%;margin:25px auto;border:12px solid #2b1012;background:conic-gradient(#e51b23 0 20%%,#111114 20%% 40%%,#ff3b30 40%% 60%%,#111114 60%% 80%%,#b90e15 80%% 100%%);display:grid;place-items:center;font-size:70px;box-shadow:0 0 50px #e51b2344;transition:transform 2.4s cubic-bezier(.12,.75,.2,1)}.result{text-align:center;font-size:20px;font-weight:900;min-height:30px}</style><title>عجلة الحظ</title></head><body><div class="head"><h1>🎡 عجلة الحظ</h1><a class="close" href="/">× خروج</a></div><main class="page"><div class="card"><div id="wheel" class="wheel">🎁</div><div id="result" class="result">اضغط لف العجلة</div><button id="spin" class="btn primary" style="width:100%;margin-top:15px" onclick="spin()">لف العجلة 🎡</button></div></main><script>async function api(u,o={}){o.credentials='same-origin';o.headers={'Content-Type':'application/json',...(o.headers||{})};if(o.body&&typeof o.body!=='string')o.body=JSON.stringify(o.body);const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}async function spin(){const b=document.getElementById('spin');b.disabled=true;try{const r=await api('/api/wheel',{method:'POST'});document.getElementById('wheel').style.transform='rotate('+(1440+Math.floor(Math.random()*360))+'deg)';setTimeout(()=>document.getElementById('result').textContent=r.message||('ربحت '+r.amount+' عملة فالكون!'),2400)}catch(e){document.getElementById('result').textContent=e.message}finally{setTimeout(()=>b.disabled=false,2450)}}</script></body></html>
