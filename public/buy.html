<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#050507;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh}*{box-sizing:border-box}.page{width:min(1050px,94%);margin:auto;padding:22px 0 90px}.head{position:sticky;top:0;z-index:10;background:rgba(5,5,7,.96);backdrop-filter:blur(14px);border-bottom:1px solid #321619;padding:14px 3%;display:flex;align-items:center;justify-content:space-between}.head a{color:#fff;text-decoration:none}.close{border:1px solid #542024;background:#100b0c;color:#fff;border-radius:12px;padding:10px 14px;text-decoration:none}.card{background:linear-gradient(145deg,#111114,#070708);border:1px solid #321619;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 18px 50px #0008}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:900;color:#ddd}.field input,.field textarea,.field select{width:100%;padding:14px;border-radius:13px;border:1px solid #392024;background:#0b0b0f;color:#fff;outline:none}.field textarea{min-height:120px;resize:vertical}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#ff3b30,#b90e15);color:#fff}.muted{color:#9b9ba3}.status{display:inline-block;padding:5px 10px;border-radius:999px;background:#180f10;border:1px solid #512125;color:#ffb6b6;font-size:12px;font-weight:900}.status.done{color:#98ff9d;border-color:#195221}.status.review{color:#ffd46d;border-color:#5a4314}.empty{text-align:center;padding:35px;color:#888}.new{display:inline-block;border:1px solid #ff4b52;color:#fff;background:#bd0f18;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.page{width:94%}.head h1{font-size:18px}}</style><title>شراء المنتج</title></head><body><div class="head"><h1 id="title">شراء</h1><a class="close" href="/samp.html">× خروج</a></div><main class="page"><div id="box" class="card"><p class="muted">جاري تحميل المنتج...</p></div></main><script>const $=id=>document.getElementById(id);async function api(u,o={}){o.credentials='same-origin';o.headers={...(o.headers||{}),'Content-Type':'application/json'};if(o.body&&typeof o.body!=='string')o.body=JSON.stringify(o.body);const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'حدث خطأ'),{code:d.code,status:r.status});return d}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function f(label,id,type='text',extra=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" ${extra}></div>`}async function init(){const id=new URLSearchParams(location.search).get('product');const d=await api('/api/products');let p=(d.products||[]).find(x=>x.id===id);if(!p&&id?.startsWith('bundle:')){const b=(await api('/api/bundles')).bundles?.find(x=>'bundle:'+x.id===id);if(b)p={id,name:b.title,icon:'🎁',desc:b.desc,price:b.price,stock:true}}if(!p&&id?.startsWith('offer:')){const o=(await api('/api/offers')).offers?.find(x=>'offer:'+x.id===id);if(o)p={id,name:o.title,icon:'🔥',desc:o.desc,price:o.price,stock:true}}if(!p){$('box').innerHTML='<h2>المنتج غير موجود</h2>';return} $('title').textContent='شراء '+p.name;let html=`<h2>${esc(p.icon)} ${esc(p.name)}</h2><p class="muted">السعر حسب المنتج والبيانات التي ستكتبها.</p>`;if(id==='customCar')html+=f('نوع العربية','carType')+f('اسمك في ديسكورد','discord')+f('لون العربية','carColor')+`<div class="field"><label>لعصابتك أو مخصصة؟</label><select id="gangChoice"><option>بدون عصابة</option><option>مع عصابة</option></select></div>`+f('اسم العصابة','gangName')+f('لون العصابة','gangColor');else if(id==='villa')html+=f('اسمك في ديسكورد','discord')+`<div class="field"><label>لعصابتك أو بدون؟</label><select id="gangChoice"><option>بدون عصابة</option><option>مع عصابة</option></select></div>`+f('اسم العصابة','gangName')+f('لون العصابة','gangColor');else if(id==='gangAlley')html+=f('اسم عصابتك','gangName')+f('اسمك في ديسكورد','discord')+f('لون عصابتك','gangColor');else if(id==='restaurant')html+=f('اسمك في ديسكورد','discord');else if(id==='customSkin')html+=f('اسمك في ديسكورد','discord')+`<div class="field"><label>قول كل حاجة عن السكن اللي عايزه</label><textarea id="skinDetails"></textarea></div>`;else if(id==='sampMoney')html+=f('اسمك في ديسكورد','discord')+f('كم فلوس عايزها؟','moneyAmount','number','min="1" max="1000000" oninput="calcMoney()"')+`<p id="moneyNeed" class="muted">اكتب الكمية لمعرفة العملات المطلوبة. الحد الأقصى 1,000,000.</p>`;else html+=f('اسمك في ديسكورد','discord')+`<div class="field"><label>البيانات المطلوبة</label><textarea id="details"></textarea></div>`;html+=`<button class="btn primary" style="width:100%" onclick="buy('${esc(id)}')">شراء <span id="buyPrice">${id==='sampMoney'?'—':Number(p.price).toLocaleString('ar-EG')+' 🪙'}</span></button>`;$('box').innerHTML=html}function calcMoney(){const n=Math.floor(Number($('moneyAmount').value||0));const coins=n>0?Math.ceil(n*.06):0;$('moneyNeed').textContent=n>0?`المطلوب: ${coins.toLocaleString('ar-EG')} عملة فالكون — 50,000 فلوس = 3,000 عملة.`:'اكتب الكمية لمعرفة العملات المطلوبة. الحد الأقصى 1,000,000.';$('buyPrice').textContent=coins?coins.toLocaleString('ar-EG')+' 🪙':'—'}async function buy(id){const q=new URLSearchParams(location.search),body={product:id,details:{}};document.querySelectorAll('#box input,#box textarea,#box select').forEach(x=>body.details[x.id]=x.value);try{const d=await api('/api/order',{method:'POST',body});location.href='/?purchase=success&product='+encodeURIComponent(id)}catch(e){if(e.code==='NO_COINS'){alert('ليس معك عملات كافية — تحتاج '+(id==='sampMoney'?document.getElementById('buyPrice').textContent:'السعر المحدد')+' عملة.')}else alert(e.message)}}init().catch(e=>{$('box').innerHTML='<h2>تعذر تحميل الصفحة</h2><p class="muted">'+esc(e.message)+'</p>'});</script></body></html>
