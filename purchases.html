<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090c"><title>مشترياتي — فالكون</title>
<link rel="stylesheet" href="/style.css">
<style>
body{background:#09090c;color:#fff}.purchasePage{width:min(1050px,calc(100% - 30px));margin:0 auto;padding:40px 0 80px}
.purchaseHero{padding:35px 0 25px}.purchaseHero .tag{color:#ffd34e;font-weight:800}.purchaseHero h1{font-size:clamp(32px,6vw,58px);margin:10px 0}.purchaseHero p{color:#888}
.purchasesList{display:grid;gap:14px}.purchaseRow{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:15px;padding:18px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(145deg,#15151b,#0d0d11)}
.purchaseIcon{font-size:32px}.purchaseInfo{display:grid;gap:6px}.purchaseInfo small{color:#777}.purchaseInfo span{color:#aaa}.purchaseInfo strong{color:#ffd34e}.purchaseInfo del{color:#777}
.orderTimeline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.orderTimeline span{position:relative;text-align:center;color:#566275;font-size:9px;padding-top:8px}.orderTimeline span:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#1c2b3e}.orderTimeline span.active{color:#76b4ff;font-weight:900}.orderTimeline span.active:before{background:#1976ff}.orderTimeline b{display:block;font-size:10px;margin-bottom:3px}.cancelledTimeline{grid-template-columns:repeat(2,1fr)}.cancelledTimeline span.active{color:#ff7180}.cancelledTimeline span.active:before{background:#d33a4d}.purchaseStatus{padding:9px 13px;border-radius:999px;background:#3a2f10;color:#ffd34e;font-style:normal;font-weight:900;font-size:11px}.purchaseStatus.done{background:#113a27;color:#69e29b}.purchaseStatus.cancelled{background:#3d1820;color:#ff7080}
@media(max-width:600px){.purchaseRow{grid-template-columns:42px 1fr}.purchaseStatus{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<header class="falconHeader"><a class="brand" href="/"><div><b>فالكون نيو</b><small>STORE</small></div></a><button class="menuBtn" onclick="toggleFalconMenu(this)" aria-label="فتح القائمة">⋮</button></header><div class="siteMenuPanel standaloneMenu" aria-hidden="true"><div class="siteMenuHead"><div><b>فالكون موقع سامب</b><small>القائمة الرئيسية</small></div><button class="siteMenuClose" onclick="toggleFalconMenu()">×</button></div><div class="siteMenuGrid"><a href="/">🏠 <span>الرئيسية</span></a><a href="/samp.html">🛒 <span>شراء سامب</span></a><a href="/purchases.html">📦 <span>مشترياتي</span></a><a href="/auctions.html">🏆 <span>المزاد</span></a><a href="/favorites.html">❤️ <span>المفضلات</span></a><a href="/">🔔 <span>الإشعارات</span></a><a href="/#support">🎧 <span>الدعم الفني</span></a><a href="/">↩️ <span>العودة للموقع</span></a></div></div><script>function toggleFalconMenu(btn){const m=document.querySelector('.standaloneMenu');if(!m)return;const o=!m.classList.contains('open');m.classList.toggle('open',o);m.setAttribute('aria-hidden',String(!o));}</script>
<main class="purchasePage">
<section class="purchaseHero"><div class="tag">FALCON PURCHASES</div><h1>🛒 مشترياتي</h1><p>كل طلباتك وحالتها في مكان واحد. الطلب الجديد يظهر مباشرة بحالة <b>سيتم التسليم</b>.</p></section>
<section class="card"><div id="status" class="muted">جارٍ تحميل مشترياتك...</div><div id="purchasesList" class="purchasesList"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
async function load(){
 try{
  const r=await fetch('/api/purchases',{credentials:'same-origin'});
  const d=await r.json();
  if(!r.ok){location.href='/';return}
  const rows=d.purchases||[];
  $('status').textContent=rows.length?`لديك ${rows.length} طلب`:'لم تشترِ أي شيء حتى الآن.';
  $('purchasesList').innerHTML=rows.map(o=>{
   const s=o.status||'جديد', disc=Number(o.discountPercent||0);
   const steps=['جديد','قيد المراجعة','قيد التجهيز','تم التسليم'];
   const current=steps.indexOf(s);
   const timeline=s==='ملغي'
     ? `<div class="orderTimeline cancelledTimeline"><span class="active">❌ تم إلغاء الطلب</span><span class="active">↩️ تم استرجاع العملات</span></div>`
     : `<div class="orderTimeline">${steps.map((st,i)=>`<span class="${i<=current?'active':''}"><b>${i<current?'✓':i===current?'●':'○'}</b>${st==='جديد'?'تم الطلب':st}</span>`).join('')}</div>`;
   return `<article class="purchaseRow"><div class="purchaseIcon">📦</div><div class="purchaseInfo"><b>${esc(o.product)}</b><small>رقم الطلب: ${esc(String(o.id).slice(0,8))} • ${new Date(o.date).toLocaleString('ar-EG')}</small><span>${disc?`<del>${Number(o.originalPrice||o.price).toLocaleString('ar-EG')} 🪙</del> `:''}<strong>${Number(o.amountPaid??o.price).toLocaleString('ar-EG')} 🪙</strong>${disc?` • خصم ${disc}%`:''}</span><div class="purchaseDetails">${o.details?Object.entries(o.details).map(([k,v])=>`<b>${esc(k)}:</b> ${esc(typeof v==='boolean'?(v?'نعم':'لا'):v)}`).join(' • '):esc(o.note||'لا توجد تفاصيل إضافية')}</div>${timeline}</div><em class="purchaseStatus ${s==='تم التسليم'?'done':s==='ملغي'?'cancelled':''}">${esc(s)}</em></article>`;
  }).join('');
 }catch(e){$('status').textContent='تعذر تحميل المشتريات.'}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
load();
</script>
</body></html>
