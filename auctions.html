<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090c"><title>مزاد فالكون</title><link rel="stylesheet" href="/style.css"><style>
.pageShell{max-width:1320px;margin:0 auto;padding:28px 24px 60px}.pageHero{padding:38px 0 22px}.pageHero h1{font-size:clamp(32px,5vw,58px);margin:8px 0}.pageHero p{color:#aaa;max-width:720px}.pageBack{display:inline-flex}.auctionList{display:grid;gap:18px}.auctionCard{display:grid;grid-template-columns:220px 1fr;gap:20px;background:#111;border:1px solid #282828;border-radius:20px;padding:20px}.auctionIcon{min-height:180px;border-radius:16px;background:linear-gradient(145deg,#171717,#080808);display:grid;place-items:center;font-size:90px}.auctionInfo h3{font-size:28px;margin:10px 0}.auctionInfo p,.auctionInfo small{color:#aaa}.auctionBadge{display:inline-block;padding:6px 10px;border-radius:8px;background:#f5b800;color:#111;font-weight:800}.auctionMeta{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}.bidRow{display:flex;gap:10px}.bidRow input{flex:1;background:#090909;border:1px solid #292929;color:#fff;border-radius:12px;padding:13px}.emptyPage{padding:50px;text-align:center;background:#111;border-radius:18px;color:#aaa}@media(max-width:700px){.pageShell{padding:20px 14px 40px}.auctionCard{grid-template-columns:1fr}.auctionIcon{min-height:140px}.bidRow{flex-direction:column}}
</style></head><body>
<header><a class="brand" href="/"><div><b>فالكون نيو</b><small>STORE</small></div></a><nav><a href="/">الرئيسية</a><a href="/samp.html">شراء سامب</a><a class="active" href="/auctions.html">🏆 المزاد</a><a href="/#rewards">استلام الهدايا</a><a href="/#support">الدعم الفني</a></nav><a class="quickBtn" href="/">العودة للموقع</a><button class="menuBtn" onclick="document.querySelector('nav').classList.toggle('open')">☰</button></header>
<main class="pageShell"><div class="pageHero"><a class="btn dark pageBack" href="/">← العودة للرئيسية</a><div class="tag">FALCON AUCTION</div><h1>🏆 مزاد فالكون 🦅</h1><p>المزادات التي ينشئها صاحب الموقع فقط. شوف أعلى مزايدة ونافس عليها بعملات فالكون.</p></div><div id="auctionList" class="auctionList"><div class="emptyPage">جاري تحميل المزادات...</div></div></main>
<div id="toast" class="toast"><b id="toastTitle"></b><span id="toastText"></span></div>
<script>
const $=id=>document.getElementById(id);let auctions=[];
async function api(url,opts={}){const o={...opts,credentials:'same-origin',headers:{...(opts.headers||{})}};if(o.body&&typeof o.body!=='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(url,o);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(t,x=''){ $('toastTitle').textContent=t;$('toastText').textContent=x;const el=$('toast');el.style.top=(window.scrollY+24)+'px';el.style.right='12px';el.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.remove('show'),3000)}
async function loadAuctions(){try{const d=await api('/api/auctions');auctions=d.auctions||[];renderAuctions()}catch(e){$('auctionList').innerHTML='<div class="emptyPage">تعذر تحميل المزادات.</div>'}}
function renderAuctions(){const rows=auctions;if(!rows.length){$('auctionList').innerHTML='<div class="emptyPage">لا يوجد مزاد حاليًا. عندما ينشئ صاحب الموقع مزادًا سيظهر هنا 🔒</div>';return}$('auctionList').innerHTML=rows.map(x=>{const leader=x.leader;const min=Number(leader?.amount||x.startBid||1)+1;return `<article class="auctionCard"><div class="auctionIcon">${esc(x.icon||'🏎️')}</div><div class="auctionInfo"><span class="auctionBadge">LIVE AUCTION</span><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><small>${esc(x.details||'')}</small><div class="auctionMeta"><b>أعلى مزايدة: ${leader?Number(leader.amount).toLocaleString('ar-EG'):'لا توجد'} 🪙</b><span>المزايدات: ${x.bidCount||0}</span><span>ينتهي: ${new Date(x.endsAt).toLocaleString('ar-EG')}</span></div><div class="bidRow"><input id="bid-${esc(x.id)}" type="number" min="${min}" placeholder="اكتب مزايدتك"><button class="btn primary" onclick="placeBid('${esc(x.id)}')">مزاد 🔥</button></div></div></article>`}).join('')}
async function placeBid(id){const input=$('bid-'+id),amount=Number(input?.value||0);if(!amount)return toast('اكتب المزايدة');try{const d=await api('/api/auctions/'+encodeURIComponent(id)+'/bid',{method:'POST',body:{amount}});toast('تمت المزايدة 🔥','أعلى مزايدة الآن '+Number(d.current).toLocaleString('ar-EG')+' عملة.');loadAuctions()}catch(e){toast('لم تتم المزايدة',e.message)}}
loadAuctions();setInterval(loadAuctions,10000);
</script></body></html>
